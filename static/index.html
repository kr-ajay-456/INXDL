<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel & Post Downloader</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#eef0f4;--mut:#8a90a0;--ac:#6c8cff}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--fg:#14161a;--mut:#666c7a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:24px 16px}
main{max-width:560px;margin:0 auto}h1{font-size:1.4rem}p{color:var(--mut)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #0003;background:var(--card);color:var(--fg);font-size:1rem}
button,a.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;text-align:center;text-decoration:none;cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:12px;margin-top:14px}
.card img,.card video{width:100%;border-radius:10px;max-height:320px;object-fit:contain;background:#000}
#err{color:#ff6b6b;margin-top:12px}
</style></head><body><main>
<h1>INXDL</h1>
<p>Post, reel ya tweet ka link paste karo.</p>
<input id="url" placeholder="https://www.instagram.com/reel/..." autocomplete="off">
<button id="go">Download karo</button>
<div id="err"></div><div id="out"></div>
<p style="font-size:.8rem">Sirf personal use ke liye. Creator ka credit do, private posts kaam nahi karenge.</p>
</main>
<script>
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{
  $("err").textContent="";$("out").innerHTML="";
  const url=$("url").value.trim();if(!url)return;
  $("go").disabled=true;$("go").textContent="Dhundh raha hu...";
  try{
    const r=await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d=await r.json();if(!r.ok)throw new Error(d.error);
    d.items.forEach((it,i)=>{
      const c=document.createElement("div");c.className="card";
      const m=document.createElement(it.type==="video"?"video":"img");
      m.src="/api/file?u="+encodeURIComponent(it.url)+"&name=x";
      if(it.type==="video"){m.controls=true;m.poster=it.thumb||"";m.playsInline=true;}
      const a=document.createElement("a");a.className="btn";a.textContent="Save "+(it.type==="video"?"video":"photo")+" "+(i+1);
      a.href="/api/file?u="+encodeURIComponent(it.url)+"&name=media_"+(i+1);
      c.append(m,a);$("out").append(c);
    });
  }catch(e){$("err").textContent=e.message}
  $("go").disabled=false;$("go").textContent="Download karo";
};
$("url").addEventListener("keydown",e=>e.key==="Enter"&&$("go").click());
</script></body></html>
